
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title></title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<style>
body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #333;

  background: #ede7f6; 

 
  background-image: 
    linear-gradient(120deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0) 50%),
    linear-gradient(150deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 60%),
    radial-gradient(circle at top left, rgba(255, 255, 255, 0.2), transparent 70%);
  background-blend-mode: overlay;
}

.lightbox {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100%;
}

.box {
  background: rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(15px);
  border-radius: 20px;
  padding: 40px;
  box-shadow: 0 8px 32px rgba(95, 108, 217, 0.25); 
  text-align: center;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.box:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 40px rgba(95, 108, 217, 0.35); 
}

input[type="password"] {
  margin: 20px 0;
  padding: 12px 20px;
  border: none;
  outline: none;
  width: 220px;
  border-radius: 12px;
  text-align: center;
  font-size: 16px;
  background: rgba(255, 255, 255, 0.9);
  transition: box-shadow 0.3s ease;
}
input[type="password"]:focus {
  box-shadow: inset 0 2px 5px rgba(95, 108, 217, 0.3), 0 0 10px rgba(95, 108, 217, 0.4);
}

#loginbutton {
  font-size: 16px;
  font-weight: 600;
  color: #fff;
  background: linear-gradient(135deg, #5F6CD9, #7A84E0);
  border: none;
  border-radius: 12px;
  padding: 12px 40px;
  cursor: pointer;
  transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
}
#loginbutton:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 18px rgba(95, 108, 217, 0.6); 
}

#wrongPassword {
  margin-top: 12px;
  font-size: 14px;
  color: #e57373; 
  display: none;
}


</style>

<body>

	<div id="loginbox" class="lightbox" >
		<div class="horizontal">
			<div class="vertical">
				<div class="box">
					<input style="margin: 18px; text-align: center; background-color: #fff;" id="password" type="password" placeholder="password" /> <br />
					<button id="loginbutton" type="button">Enter</button>
					<p id="wrongPassword" style="display: none">wrong password</p>
				</div>
			</div>
		</div>
	</div>



	<script type="text/javascript" src="https://code.jquery.com/jquery-1.12.0.min.js"></script>


	 <script type="text/javascript" src="https://rawcdn.githack.com/chrisveness/crypto/7067ee62f18c76dd4a9d372a00e647205460b62b/sha1.js"></script>

	<script type="text/javascript">
	"use strict";


	function loadPage(pwd) {

		var hash= pwd;
		hash= Sha1.hash(pwd);
		var url= hash + "/index.html";

		$.ajax({
			url : url,
			dataType : "html",
			success : function(data) {

				window.location= url;

			},
			error : function(xhr, ajaxOptions, thrownError) {


				parent.location.hash= hash;

				//$("#wrongPassword").show();
				$("#password").attr("placeholder","wrong password");
				$("#password").val("");
			}
		});
	}


	$("#loginbutton").on("click", function() {
		loadPage($("#password").val());
	});
	$("#password").keypress(function(e) {
		if (e.which == 13) {

			loadPage($("#password").val());
		}
	});
	$("#password").focus();

	</script>

</body>
</html>
